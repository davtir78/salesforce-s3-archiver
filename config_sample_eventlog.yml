# Sample configuration for sf-archive-eventlog. Values like $VAR are read from the environment.
version: "3.0"
logLevel: info
env: prod                                # deployment identifier stored in every archived line
metricsAddr: ":9090"

eventLog:
  instanceName: myorg-prod
  apiVer: "64.0"
  requestTimeout: 30                     # seconds, API calls (downloads are not limited)
  pollIntervalSeconds: 300
  watermarkOverlapMinutes: 60            # re-read window for late-arriving records
  auth:
    tokenUrl: https://example.my.salesforce.com
    clientCred:
      clientId: $SF_CLIENT_ID
      clientSecret: $SF_CLIENT_SECRET
  cache:
    redis:                               # recommended; without it watermarks reset on restart
      host: master.my-cache.xxxxxx.apse2.cache.amazonaws.com
      port: 6379
      username: archiver
      password: $REDIS_PASSWORD
      expireDays: 7                      # de-duplication markers only
      tls:
        enabled: true
  initialTimeInterval:                   # how far back to start when no watermark exists
    hours: 24
  # noInterval: true                     # include Daily EventLogFiles (default: Hourly only)
  eventTypes:                            # empty = all event types
    - Login
    - API
    - URI
    - Report
  # fieldMapping:                        # optional: keep only these columns per event type
  #   Login: [USER_ID, CLIENT_IP, LOGIN_STATUS]
  customQueries:
    - soql:
        select: [Id, Action, Section, Display, CreatedDate, CreatedById]
        from: SetupAuditTrail
      timestamp: CreatedDate
      apiName: rest                      # rest or tooling
  recordsPerObject: 10000
  limits:
    names: [DailyApiRequests, DailyStreamingApiEvents, HourlyPublishedStandardVolumePlatformEvents]
  # skipLimits: true
  # skipLogFiles: true

archive:
  s3:
    bucket: my-salesforce-archive
    prefix: salesforce
    region: ap-southeast-2
