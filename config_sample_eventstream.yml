# Sample configuration for sf-archive-stream. Values like $VAR are read from the environment.
version: "3.0"
logLevel: info
metricsAddr: ":9090"
# orgId: 00D...   # optional override; discovered from the userinfo endpoint

eventStream:
  instanceName: myorg-prod               # unique per org; part of checkpoint keys
  auth:
    tokenUrl: https://example.my.salesforce.com
    # Exactly one auth method. Client credentials or JWT are recommended.
    clientCred:
      clientId: $SF_CLIENT_ID
      clientSecret: $SF_CLIENT_SECRET
    # jwt:
    #   clientId: $SF_CLIENT_ID
    #   privateKey: /secrets/salesforce.key
    #   username: integration@example.com
  cache:
    redis:                               # required for the stream collector
      host: master.my-cache.xxxxxx.apse2.cache.amazonaws.com
      port: 6379
      tls:
        enabled: true
      # Password / AUTH token or RBAC user:
      username: archiver
      password: $REDIS_PASSWORD
      # Or ElastiCache IAM authentication (no password):
      # iamAuth:
      #   enabled: true
      #   cacheName: my-cache            # replication group ID or serverless cache name
      #   userId: archiver-iam           # must equal the ElastiCache user name
      #   region: ap-southeast-2
      #   serverless: false
      # mode: cluster                    # for cluster-mode-enabled caches
      # keyPrefix: "prod:"
  # Where to start when a topic has no checkpoint: EARLIEST or LATEST.
  # Leave empty in steady state so a lost checkpoint stops the collector
  # instead of silently skipping data.
  initialReplay: ""
  appetite: 100                          # events requested per fetch (Salesforce maximum is 100)
  leaseTtlSeconds: 30
  shutdownFlushTimeoutSeconds: 90        # keep below the orchestrator stop timeout (ECS stopTimeout, compose stop_grace_period)
  batch:
    maxEvents: 2000                      # flush when this many events are buffered
    maxAgeSeconds: 30                    # ...or when the oldest buffered event is this old
  topics:
    - /event/LoginEventStream
    - /event/ApiEventStream
    - /event/LightningUriEventStream
    - /event/UriEventStream
    - /event/ReportEventStream
    - /event/ListViewEventStream
    - /event/LogoutEventStream
    - /event/LoginAsEventStream
    - /event/SessionHijackingEvent
    - /event/CredentialStuffingEvent
    - /event/ReportAnomalyEvent
    - /event/ApiAnomalyEvent
    - /event/PermissionSetEvent
    - /event/FileEvent

archive:
  s3:
    bucket: my-salesforce-archive
    prefix: salesforce
    region: ap-southeast-2
    # kmsKeyId: arn:aws:kms:...          # optional; bucket default encryption also applies
    # uploadTimeoutSeconds: 300
    # maxAttempts: 5
